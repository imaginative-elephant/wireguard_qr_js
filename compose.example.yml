services:
  wireguard-qr:
    image: imaginative-elephant/wireguard-qr:latest
    container_name: wireguard-qr
    ports:
      - '${WEB_PORT:-8080}:8080'
    environment:
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    restart: unless-stopped
    # user: "${PUID:-1000}:${PGID:-1000}"
    # read_only: true
    # tmpfs:
    #   - /tmp:size=64M,noexec,nosuid
    #   - /var/cache/nginx:size=32M,noexec,nosuid
    #   - /var/log/nginx:size=16M,noexec,nosuid

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
